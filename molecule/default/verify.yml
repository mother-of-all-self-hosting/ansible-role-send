---
- name: Verify Send
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Uploaded verbatim and read back off disk, so it must survive a round trip
    # through Send's WebSocket upload path unchanged.
    send_verify_payload: molecule-send-payload-42

    # Send stores a blob under `<prefix>-<id>`, where the prefix is the upload's
    # lifetime in whole days, floored, and at least 1. The probe asks for one
    # hour, so the prefix is deterministically 1.
    send_verify_blob_prefix: 1

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: send_defaults

    # The Jinja-derived values, resolved by the role itself during converge.
    - name: Read the values the role resolved
      ansible.builtin.slurp:
        src: /root/send-molecule-resolved.json
      register: send_resolved_raw

    - name: Remember the values the role resolved
      ansible.builtin.set_fact:
        send_resolved: "{{ send_resolved_raw.content | b64decode | from_json }}"

    # Worth little on its own: the systemd unit carries `Restart=always`, so a
    # container that crashes on every boot still reports `active`. Everything
    # below is what actually decides whether Send works.
    - name: Wait for Send service to become active (up to 180s)
      ansible.builtin.systemd:
        name: send.service
      register: send_service
      until: send_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Send service is active
      ansible.builtin.assert:
        that: send_service.status.ActiveState == 'active'
        fail_msg: "send.service not active ({{ send_service.status.ActiveState }})"
        success_msg: "send.service is active"

    - name: Retrieve Send service log for debugging
      when: send_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu send.service
      changed_when: false

    - name: Wait for Send to serve its version endpoint (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:1443/__version__"
        method: GET
        status_code: [200]
        follow_redirects: none
      register: send_version_endpoint
      until: send_version_endpoint.status == 200
      retries: 120
      delay: 5

    - name: Assert the running Send is the version this role installs
      ansible.builtin.assert:
        that: send_version_endpoint.json.version == send_defaults.send_version
        fail_msg: "Send reports {{ send_version_endpoint.json.version | default('none') }}, expected {{ send_defaults.send_version }}"
        success_msg: "Send reports {{ send_version_endpoint.json.version }}"

    - name: Determine which container image Send runs
      ansible.builtin.command:
        cmd: docker inspect --format {{ '{{.Config.Image}}' }} send
      register: send_container_image_in_use
      changed_when: false

    # Two claims, and the second is the one that matters for automerge: the
    # container runs the image the role computed, and that image's tag is the
    # very literal Renovate edits in defaults/main.yml.
    - name: Assert Send runs the image the role configures
      ansible.builtin.assert:
        that:
          - send_container_image_in_use.stdout == send_resolved.container_image
          - send_container_image_in_use.stdout.split(':') | last == send_defaults.send_version
        fail_msg: >-
          Send runs {{ send_container_image_in_use.stdout }},
          but the role configures {{ send_resolved.container_image }}
          at version {{ send_defaults.send_version }}
        success_msg: "Send runs {{ send_container_image_in_use.stdout }}"

    - name: Run the checks shared by all Send scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    - name: Ask Send whether the upload exists
      ansible.builtin.uri:
        url: "http://localhost:1443/api/exists/{{ send_upload_result.id }}"
        method: GET
        status_code: [200]
        follow_redirects: none
      register: send_exists_endpoint

    # The counterpart matters as much as the check above: `/api/exists` answers
    # 404 for an identifier that was never uploaded, so a 200 for the real one
    # is a genuine lookup in Valkey rather than a blanket success.
    - name: Ask Send about an identifier that was never uploaded
      ansible.builtin.uri:
        url: "http://localhost:1443/api/exists/00000000000000ff"
        method: GET
        status_code: [404]
        follow_redirects: none
      register: send_missing_endpoint

    - name: Assert Send looks uploads up in Valkey
      ansible.builtin.assert:
        that:
          - send_exists_endpoint.status == 200
          - send_missing_endpoint.status == 404
        fail_msg: "Send does not distinguish an uploaded identifier from an unknown one"
        success_msg: "Send resolves the uploaded identifier and rejects an unknown one"

    - name: Show the Send verification summary
      ansible.builtin.debug:
        msg:
          - "Send systemd: {{ send_service.status.ActiveState }}"
          - "Send version: {{ send_version_endpoint.json.version }}"
          - "Send image: {{ send_container_image_in_use.stdout }}"
          - "Send heartbeat: {{ send_heartbeat_endpoint.status }}"
          - "Send upload {{ send_upload_result.id }} stored via Valkey and under {{ send_resolved.data_path }}"
