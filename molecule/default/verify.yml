---
- name: Verify Send
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Uploaded verbatim and read back off disk, so it must survive a round trip
    # through Send's WebSocket upload path unchanged.
    send_verify_payload: molecule-send-payload-42

    # Send stores a blob under `<prefix>-<id>`, where the prefix is the upload's
    # lifetime in whole days, floored, and at least 1. The probe asks for one
    # hour, so the prefix is deterministically 1.
    send_verify_blob_prefix: 1

    send_verify_units:
      - send.service
      - valkey.service

  tasks:
    - name: Verify that Send works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: send_defaults

        - name: Wait for the Send systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: send_services
          until: send_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ send_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Send systemd services are active
          ansible.builtin.assert:
            that: send_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(send_verify_units | zip(send_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Send systemd services log for debugging
          when: send_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ send_verify_units }}"

        - name: Wait for Send to serve its version endpoint (up to 10m)
          ansible.builtin.uri:
            url: "http://localhost:1443/__version__"
            method: GET
            status_code: [200]
            follow_redirects: none
          register: send_version_reported
          until: send_version_reported.status == 200
          retries: 120
          delay: 5

        - name: Assert the running Send is the version this role installs
          ansible.builtin.assert:
            that: send_version_reported.json.version == send_defaults.send_version
            fail_msg: "Send reports {{ send_version_reported.json.version | default('none') }}, expected {{ send_defaults.send_version }}"
            success_msg: "Send reports {{ send_version_reported.json.version }}"

        - name: Determine which container image Send runs
          ansible.builtin.command:
            cmd: docker inspect --format {{ '{{.Config.Image}}' }} send
          register: send_container_image_in_use
          changed_when: false

        # The Jinja-derived values, resolved by the role itself during converge.
        - name: Read the values the role resolved
          ansible.builtin.slurp:
            src: /root/send-molecule-resolved.json
          register: send_resolved_raw

        - name: Remember the values the role resolved
          ansible.builtin.set_fact:
            send_resolved: "{{ send_resolved_raw.content | b64decode | from_json }}"

        # Two claims, and the second is the one that matters for automerge: the
        # container runs the image the role computed, and that image's tag is the
        # very literal Renovate edits in defaults/main.yml.
        - name: Assert Send runs the image the role configures
          ansible.builtin.assert:
            that:
              - send_container_image_in_use.stdout == send_resolved.container_image
              - send_container_image_in_use.stdout.split(':') | last == send_defaults.send_version
            fail_msg: >-
              Send runs {{ send_container_image_in_use.stdout }},
              but the role configures {{ send_resolved.container_image }}
              at version {{ send_defaults.send_version }}
            success_msg: "Send runs {{ send_container_image_in_use.stdout }}"

        - name: Run the checks shared by all Send scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        - name: Show the Send verification summary
          ansible.builtin.debug:
            msg:
              - "Send systemd: {% for unit, state in send_verify_units | zip(send_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Send version: {{ send_version_reported.json.version }}"
              - "Send image: {{ send_container_image_in_use.stdout }}"
              - "Send heartbeat: {{ send_heartbeat_endpoint.status }}"
              - "Send upload {{ send_upload_result.id }} stored via Valkey and under {{ send_resolved.data_path }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Send systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=send.service
          register: send_service_log
          changed_when: false

        - name: Show the Send systemd service log
          ansible.builtin.debug:
            var: send_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Send verification failed. The systemd service log is printed above."
